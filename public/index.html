<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KidsTube</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='14' width='60' height='40' rx='10' fill='%23e63946'/%3E%3Cpolygon points='26,22 26,46 48,34' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css?v=3" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuToggle" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <div class="brand">
      <span class="brand-logo">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect x="2" y="14" width="60" height="40" rx="10" fill="#e63946"/>
          <polygon points="26,22 26,46 48,34" fill="white"/>
        </svg>
      </span>
      <span class="brand-text">Kids<span class="brand-accent">Tube</span></span>
    </div>
    <div class="spacer"></div>
    <button class="shuffle-btn" id="shuffleBtn" aria-label="Shuffle videos">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      <span>Shuffle</span>
    </button>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Channels</div>
      <nav id="channelNav"></nav>
    </div>
    <div class="sidebar-footer">
      <span id="lastUpdated"></span>
    </div>
  </aside>

  <main class="main">
    <div id="hero" class="hero">
      <h1>Today's picks, shuffled</h1>
      <p>20 random videos per channel · all mixed together · refreshed every 12 hours</p>
    </div>
    <div id="content"></div>
  </main>

  <!-- Player modal -->
  <div class="player-overlay" id="playerOverlay" aria-hidden="true">
    <div class="player-box">
      <button class="player-close" id="playerClose" aria-label="Close">×</button>
      <div class="player-frame" id="playerFrame"></div>
      <div class="player-info">
        <div class="player-title" id="playerTitle"></div>
        <div class="player-channel" id="playerChannel"></div>
      </div>
    </div>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
